<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZapytAnia – Panel użytkownika</title>
    <link rel="stylesheet" href="/dashboard.css" />
  </head>

  <body>
    <!-- ======= Pasek górny ======= -->
    <header class="topbar">
      <div class="left">
        <input type="text" placeholder="🔍 Wyszukaj..." class="search" />
        <button class="nav-btn">Quizy</button>
      </div>

      <div class="right">
        <!-- 🔹 Import fiszek -->
        <div class="import-box">
          <h3>📁 Import fiszek</h3>
          <p>angielskie=polskie</p>

          <input type="file" id="fileInput" accept=".txt" hidden />
          <input
            type="text"
            id="setName"
            placeholder="Nazwa zestawu"
            class="set-name"
          />
          <button id="importBtn" class="import-btn">
            <span class="plus">+</span> Importuj
          </button>
        </div>

        <!-- 🔹 Profil użytkownika -->
        <div class="user-card">
          <div class="avatar" id="userAvatar">?</div>
          <div class="user-info">
            <p class="hello">Cześć,</p>
            <p id="nickname" class="nickname">Gość</p>
          </div>
          <button id="logoutBtn" class="logout-btn">Wyloguj</button>
        </div>
      </div>
    </header>

    <!-- ======= Zawartość główna ======= -->
    <main class="content">
      <section class="main-panel">
        <div class="flashcard-list">
          <h3>📘 Twoje zestawy fiszek</h3>
          <ul id="flashcardSets">
            <li>Brak zaimportowanych zestawów</li>
          </ul>
        </div>
      </section>

      <aside class="sidebar">
        <div class="ranking">
          <h3>🏆 Ranking</h3>
          <ul>
            <li>1. Ania — 19/19</li>
            <li>2. Kuba — 17/19</li>
            <li>3. Ola — 16/19</li>
          </ul>
        </div>

        <!-- 🔹 Historia nauki POD rankingiem -->
        <div class="history-card">
          <h3>🕒 Historia nauki</h3>
          <ul id="historyList">
            <li>Brak historii</li>
          </ul>
        </div>
      </aside>
    </main>

    <script>
      // ====== Token check ======
      const token = localStorage.getItem("token");
      if (!token) console.warn("Brak tokena – tryb gościa.");

      // ====== Elementy ======
      const importBtn = document.getElementById("importBtn");
      const fileInput = document.getElementById("fileInput");
      const setNameInput = document.getElementById("setName");
      const flashcardSets = document.getElementById("flashcardSets");

      // ====== Import fiszek ======
      importBtn.addEventListener("click", () => fileInput.click());

      fileInput.addEventListener("change", async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        const setName =
          setNameInput.value.trim() || file.name.replace(".txt", "");
        localStorage.setItem("lastSetName", setName);

        const formData = new FormData();
        formData.append("file", file);
        formData.append("name", setName);

        const res = await fetch("/api/flashcards/import", {
          method: "POST",
          body: formData,
        });

        if (res.ok) {
          const data = await res.json();
          alert(data.message);

          const li = document.createElement("li");
          li.classList.add("set-item");
          li.innerHTML = `
            <span>${setName}</span>
            <button class="start-btn" data-setid="${data.setId}">▶ Start</button>
          `;
          flashcardSets.appendChild(li);

          setNameInput.value = "";
          renderProgressBars();
          renderHistory(); // ✅ odśwież historię po imporcie
        } else {
          const err = await res.json();
          alert("❌ Błąd podczas importu: " + err.message);
        }

        fileInput.value = "";
      });

      // ====== Przycisk START ======
      flashcardSets.addEventListener("click", (e) => {
        if (e.target.classList.contains("start-btn")) {
          const setId = e.target.dataset.setid;
          window.location.href = `/srs.html?set=${setId}`;
        }
      });

      // ====== Historia nauki ======
async function renderHistory() {
  const historyList = document.getElementById("historyList");
  historyList.innerHTML = "<li>⏳ Ładowanie historii...</li>";

  try {
    const res = await fetch("/api/reviews/history");
    if (!res.ok) throw new Error("Błąd pobierania historii");

    let history = await res.json();
    historyList.innerHTML = "";

    if (!history.length) {
      historyList.innerHTML = "<li>Brak historii nauki</li>";
      return;
    }

    // 🔹 SORTUJEMY — najnowsze (minutesAgo = najmniejsze) na górze
    history = history.sort((a, b) => {
      if (a.minutesAgo === null) return 1; // brak danych → na końcu
      if (b.minutesAgo === null) return -1;
      return a.minutesAgo - b.minutesAgo;
    });

    history.forEach((h) => {
      const color =
        h.mastery < 50 ? "bad" : h.mastery < 70 ? "mid" : "good";
      const agoText = h.minutesAgo
        ? `${h.minutesAgo} min temu`
        : "brak danych";

      const li = document.createElement("li");
      li.innerHTML = `
        <div>
          <strong>${h.setName}</strong><br>
          <small>${agoText}</small>
        </div>
        <span class="score ${color}">${h.mastery}%</span>
      `;
      historyList.appendChild(li);
    });
  } catch (err) {
    console.error("❌ Błąd historii nauki:", err);
    historyList.innerHTML = "<li>❌ Błąd ładowania historii</li>";
  }
}

      document.addEventListener("DOMContentLoaded", renderHistory);

      // ====== Pasek postępu ======
      // ====== 📘 Wyświetlanie zestawów fiszek ======
async function renderFlashcardSets() {
  const container = document.getElementById("flashcardSets");
  container.innerHTML = "<li>⏳ Ładowanie zestawów...</li>";

  try {
    const res = await fetch("/api/flashcards/all");
    if (!res.ok) throw new Error("Błąd pobierania zestawów");
    const sets = await res.json();

    if (!sets.length) {
      container.innerHTML = "<li>Brak zestawów. Zaimportuj plik .txt 👇</li>";
      return;
    }

    container.innerHTML = "";
    sets.forEach((set) => {
      const li = document.createElement("li");
      li.classList.add("set-item");

      li.innerHTML = `
        <div>
          <strong>${set.name}</strong><br>
          <small>${set.count} słówek • ${new Date(
            set.createdAt
          ).toLocaleDateString("pl-PL")}</small>
        </div>

        <div style="display:flex; gap:8px;">
          <button class="btn-srs" data-id="${set.id}">🔁 Powtórka SRS</button>
          <button class="btn-all" data-id="${set.id}">🧠 Trening pełny</button>
          <button class="btn-view" data-id="${set.id}">👁️ Podgląd</button>
          <button class="btn-del" data-id="${set.id}">🗑️ Usuń</button>
        </div>
      `;

      container.appendChild(li);
    });
  } catch (err) {
    console.error("❌ Błąd ładowania zestawów:", err);
    container.innerHTML = "<li>Błąd ładowania zestawów</li>";
  }
}

// ====== Obsługa przycisków w zestawach ======
document
  .getElementById("flashcardSets")
  .addEventListener("click", async (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    const id = btn.dataset.id;

    if (btn.classList.contains("btn-srs")) {
      window.location.href = `/srs.html?set=${id}&mode=srs`;
    }

    if (btn.classList.contains("btn-all")) {
      window.location.href = `/srs.html?set=${id}&mode=all`;
    }

    if (btn.classList.contains("btn-view")) {
      const res = await fetch(`/api/flashcards/set/${id}`);
      const cards = await res.json();

      const rows = cards
        .map(
          (c, i) =>
            `<tr><td>${i + 1}</td><td>${c.front}</td><td>${c.back}</td></tr>`
        )
        .join("");

      const html = `
        <div class="modal-bg" id="modal">
          <div class="modal">
            <h3>📘 ${cards.length} fiszek</h3>
            <table border="1" style="width:100%;border-collapse:collapse;">
              <thead><tr><th>#</th><th>Front</th><th>Back</th></tr></thead>
              <tbody>${rows}</tbody>
            </table>
            <button id="closeModal" style="margin-top:10px;">Zamknij</button>
          </div>
        </div>
      `;

      document.body.insertAdjacentHTML("beforeend", html);
      document
        .getElementById("closeModal")
        .addEventListener("click", () =>
          document.getElementById("modal").remove()
        );
    }

    if (btn.classList.contains("btn-del")) {
      if (!confirm("Na pewno chcesz usunąć ten zestaw?")) return;
      await fetch(`/api/flashcards/delete/${id}`, { method: "DELETE" });
      renderFlashcardSets();
      renderHistory(); // ✅ odśwież historię
    }
  });

// ====== Start ======
document.addEventListener("DOMContentLoaded", () => {
  renderFlashcardSets();
  renderHistory();
});


      // ====== Dane użytkownika ======
      async function loadUser() {
        try {
          const res = await fetch("/api/auth/me", {
            headers: { Authorization: `Bearer ${token}` },
          });
          if (res.ok) {
            const data = await res.json();
            const nickname = data.user.nickname || "Użytkownik";
            document.getElementById("nickname").textContent = nickname;
            document.getElementById("userAvatar").textContent =
              nickname[0].toUpperCase();
          }
        } catch {
          console.warn("Tryb gościa – bez logowania.");
        }
      }

      loadUser();

      document.getElementById("logoutBtn").addEventListener("click", () => {
        localStorage.removeItem("token");
        window.location.href = "/";
      });
    </script>
  </body>
</html>
